---
# To run this playbook, use the command (asking for the pw interactively):
# ansible-playbook -i gandi.ini packages_install.yml -b -K
# ansible-playbook -i gandi.ini packages_install.yml -b -K -e "ansible_user=ubuntu"

- name: Install Ubuntu package
  hosts: all
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: yes

    - name: Install Ubuntu apt packages
      ansible.builtin.apt:
        name:
          - build-essential
          - emacs-nox
          - just
          - make
          - python3
          - python3-pip
          - python3-venv
        state: present
