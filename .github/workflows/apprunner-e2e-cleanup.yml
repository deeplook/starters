name: App Runner End-to-End Test Cleanup

# This workflow is triggered automatically when another workflow run completes.
on:
  workflow_run:
    # The name of the workflow to watch.
    workflows: ["App Runner End-to-End Test"]
    types:
      - completed

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required to check out the repository

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Use the same role ARN as your main workflow
          role-to-assume: arn:aws:iam::629215267253:role/GitHubActionsRole
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Run Terraform Destroy
        run: |
          echo "--- 🧹 Triggering cleanup for failed E2E run ---"
          terraform init
          # Use the e2e.tfvars file to ensure we destroy the correct environment
          terraform destroy -auto-approve -var-file="e2e.tfvars"
        working-directory: ./aws-apprunner/terraform
