name: App Runner End-to-End Test

on:
  workflow_dispatch: # Allows manual triggering

# These permissions are required for the OIDC flow
permissions:
  id-token: write
  contents: read

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::629215267253:role/GitHubActionsRole # Role ARN from the aws-github-oidc terraform output
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Run End-to-End Test
        run: |
          # Step 1: Create a temporary tfvars file for the E2E run
          # We explicitly set create_apprunner_service to false for the first run.
          echo "--- 📝 Creating terraform.tfvars for E2E ---"
          cp terraform.tfvars.example terraform.tfvars
          echo 'environment = "e2e-test"' >> terraform.tfvars
          echo 'create_apprunner_service = false' >> terraform.tfvars

          # Step 2: Provision ONLY the ECR repository
          echo "--- 🚀 Provisioning ECR Repository ---"
          rm -rf .terraform
          terraform init
          terraform apply -auto-approve

          # Step 3: Build and push the application image to the new repository
          echo "--- 📦 Building and Pushing Docker Image ---"
          ./push_image.sh

          # Step 4: Provision the App Runner service, which now has a valid image
          echo "--- 🚀 Provisioning App Runner Service ---"
          terraform apply -auto-approve -var="create_apprunner_service=true"

          # Step 5: Run smoke tests against the live service
          echo "--- 🔬 Running Smoke Tests ---"
          SERVICE_URL=$(terraform output -raw app_service_url)
          ./run_smoke_tests.sh $SERVICE_URL

          # Step 6: Clean up all temporary resources
          echo "--- 🧹 Destroying Temporary E2E Environment ---"
          terraform destroy -auto-approve -var="create_apprunner_service=true"
        working-directory: ./aws-apprunner/terraform
