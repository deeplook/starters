name: App Runner End-to-End Test

on:
  workflow_dispatch: # Allows manual triggering

# These permissions are required for the OIDC flow
permissions:
  id-token: write
  contents: read

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::629215267253:role/GitHubActionsRole # Role ARN from the aws-github-oidc terraform output
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Run End-to-End Test
        run: |
          # Step 1: Build and push the Docker image
          echo "--- 📦 Building and Pushing Docker Image ---"
          ./push_image.sh

          # Step 2: Provision the temporary infrastructure
          echo "--- 🚀 Provisioning Temporary E2E Environment ---"
          terraform init
          terraform apply -auto-approve -var-file="e2e.tfvars"

          # Step 3: Run smoke tests against the new service
          echo "--- 🔬 Running Smoke Tests ---"
          SERVICE_URL=$(terraform output -raw app_service_url)
          ./run_smoke_tests.sh $SERVICE_URL

          # Step 4: Clean up the temporary environment
          echo "--- 🧹 Destroying Temporary E2E Environment ---"
          terraform destroy -auto-approve -var-file="e2e.tfvars"
        working-directory: ./aws-apprunner/terraform
