[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "python-service"
version = "0.1.0"
description = "Async gRPC demo service implemented in Python"
readme = "../README.md"
requires-python = ">=3.12"
authors = [{ name = "Demo" }]
dependencies = [
    "grpcio>=1.62.1",
    "grpcio-tools>=1.62.1",
    "protobuf>=4.25.0",
    "grpcio-reflection>=1.62.1",
    "grpcio-health-checking>=1.62.1",
]

[tool.hatch.build.targets.wheel]
packages = ["python_service"]
