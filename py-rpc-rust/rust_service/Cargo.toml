[package]
name = "rust_service"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
prost-types = "0.12"
tonic-reflection = "0.11"
tonic-health = "0.11"

[build-dependencies]
tonic-build = "0.11"
