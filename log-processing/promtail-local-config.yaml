server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /Users/dinugherman/dev/starters/log-processing/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
- job_name: macbook_stats
  static_configs:
  - targets:
      - localhost
    labels:
      job: macbook_stats
      __path__: /Users/dinugherman/dev/starters/log-processing/mac_stats.log
  pipeline_stages:
  - json:
      expressions:
        component: component
        cpu_usage_percent: cpu_usage_percent
        memory_free_percent: memory_free_percent
        battery_percentage: battery_percentage
        power_source: power_source
  - labels:
      component:
      power_source:
